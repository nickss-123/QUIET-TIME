<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiet Time — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #3a385c 0%, #f5b261 100%);
        color: #fff8ee;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      div {
        max-width: 320px;
      }
      h1 {
        font-size: 1.3rem;
        margin-bottom: 8px;
      }
      p {
        opacity: 0.85;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>This page hasn't been opened on this device yet, so it isn't saved for offline use. Pages you've already visited still work, and anything you save is kept on this device until you're back online.</p>
      <p><a href="/morning" style="color:inherit;font-weight:600">Open my morning form</a></p>
      <p><button onclick="location.reload()" style="margin-top:8px;padding:10px 18px;border-radius:999px;border:0;background:#fff8ee;color:#3a385c;font-weight:600">Try again</button></p>
    </div>
  </body>
</html>
